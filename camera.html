<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鱼缸实时监测</title>
    <link rel="stylesheet" href="../style.css"> <!-- 引用原有CSS -->
    <style>
        :root {
            --primary-color: #3b82f6;
            --secondary-color: #8b5cf6;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --healthy-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('./aquarium-bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.2;
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 头部样式 */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            position: relative;
        }

        .header h1 {
            font-size: 2.8rem;
            background: linear-gradient(90deg, #ffffff, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.2);
        }

        .header p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* 主要内容区域 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* 视频监控区域 */
        .video-section {
            background: linear-gradient(135deg, var(--card-bg), #334155);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.1);
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            display: block;
            width: 8px;
            height: 24px;
            background: var(--primary-color);
            border-radius: 4px;
        }

        .video-container {
            width: 100%;
            height: 400px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            margin-bottom: 20px;
            position: relative;
        }

        #videoFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            background: linear-gradient(135deg, #1a1f2e, #2d3748);
        }

        .video-placeholder i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .video-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .control-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .control-btn:active {
            transform: translateY(-1px);
        }

        .control-btn.stop {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        /* 数据监测区域 */
        .data-section {
            background: linear-gradient(135deg, var(--card-bg), #334155);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid var(--primary-color);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(30, 41, 59, 0.9);
        }

        .stat-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        .stat-unit {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* 检测框显示区域 */
        .detection-section {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .detection-title {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detection-boxes {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .detection-box {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 180px;
            width: calc(50% - 8px);
        }

        @media (max-width: 768px) {
            .detection-box {
                width: 100%;
            }
        }

        .box-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 8px;
            align-items: center;
        }

        .box-label {
            font-size: 1rem;
            font-weight: 600;
            opacity: 0.9;
        }

        .health-status {
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .health-healthy {
            background-color: var(--healthy-color);
        }

        .health-warning {
            background-color: var(--warning-color);
        }

        .health-danger {
            background-color: var(--danger-color);
        }

        .box-details {
            width: 100%;
            margin-top: 8px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-label {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .detail-value {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .fish-type {
            color: #ffd700;
            font-weight: 600;
        }

        .empty-detection {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-style: italic;
            width: 100%;
        }

        /* 健康统计区域 */
        .health-stats {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .health-stat {
            padding: 10px;
        }

        .health-stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .health-stat-label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .healthy-count { color: var(--healthy-color); }
        .warning-count { color: var(--warning-color); }
        .danger-count { color: var(--danger-color); }

        /* 日志区域 */
        .log-section {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 12px;
            padding: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-title {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .log-list {
            list-style-type: none;
        }

        .log-item {
            padding: 10px 15px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-time {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* 鱼类种类筛选 */
        .fish-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 12px;
            background: rgba(59, 130, 246, 0.2);
            color: var(--primary-color);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            background: rgba(59, 130, 246, 0.3);
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
        }

        /* 底部区域 */
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(148, 163, 184, 0.2);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .header p {
                font-size: 1rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .video-container {
                height: 300px;
            }
            
            .control-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            
            .health-stats {
                flex-direction: column;
                gap: 15px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.7rem;
            }
            
            .video-controls {
                flex-direction: column;
            }
            
            .control-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
    <!-- 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>海王鱼缸实时监测系统</h1>
            <p>实时监控鱼缸状态，检测鱼类活动，跟踪健康状况和种类信息</p>
        </div>
        
        <div class="main-content">
            <!-- 左侧：视频监控 -->
            <div class="video-section">
                <h2 class="section-title">实时画面</h2>
                
                <div class="video-container">
                    <img id="videoFeed" src="" alt="鱼缸实时画面" style="display: none;">
                    <div class="video-placeholder" id="videoPlaceholder">
                        <i class="fas fa-fish"></i>
                        <p>点击"启动监控"开始查看实时画面</p>
                    </div>
                </div>
                
                <div class="video-controls">
                    <button class="control-btn" id="startBtn" onclick="startMonitoring()">
                        <i class="fas fa-play"></i> 启动监控
                    </button>
                    <button class="control-btn stop" id="stopBtn" onclick="stopMonitoring()" disabled>
                        <i class="fas fa-stop"></i> 停止监控
                    </button>
                </div>
            </div>
            
            <!-- 右侧：监测数据 -->
            <div class="data-section">
                <h2 class="section-title">监测数据</h2>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-title">
                            <i class="fas fa-tachometer-alt"></i> 帧率
                        </div>
                        <div class="stat-value" id="fpsValue">0.0</div>
                        <div class="stat-unit">帧/秒</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-title">
                            <i class="fas fa-fish"></i> 鱼类数量
                        </div>
                        <div class="stat-value" id="detectionCount">0</div>
                        <div class="stat-unit">条</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-title">
                            <i class="fas fa-film"></i> 帧编号
                        </div>
                        <div class="stat-value" id="frameId">0</div>
                        <div class="stat-unit">帧</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-title">
                            <i class="fas fa-clock"></i> 最后更新
                        </div>
                        <div class="stat-value" id="lastUpdate">0</div>
                        <div class="stat-unit">秒前</div>
                    </div>
                </div>
                
                <!-- 健康统计 -->
                <div class="health-stats">
                    <div class="health-stat">
                        <div class="health-stat-value healthy-count" id="healthyCount">0</div>
                        <div class="health-stat-label">健康</div>
                    </div>
                    <div class="health-stat">
                        <div class="health-stat-value warning-count" id="warningCount">0</div>
                        <div class="health-stat-label">需关注</div>
                    </div>
                    <div class="health-stat">
                        <div class="health-stat-value danger-count" id="dangerCount">0</div>
                        <div class="health-stat-label">异常</div>
                    </div>
                </div>
                
                <!-- 鱼类筛选 -->
                <div class="fish-filter" id="fishFilter">
                    <button class="filter-btn active" onclick="filterFishType('all')">全部</button>
                    <button class="filter-btn" onclick="filterFishType('clownfish')">小丑鱼</button>
                    <button class="filter-btn" onclick="filterFishType('angel')">神仙鱼</button>
                    <button class="filter-btn" onclick="filterFishType('tang')">倒吊鱼</button>
                    <button class="filter-btn" onclick="filterFishType('guppy')">孔雀鱼</button>
                    <button class="filter-btn" onclick="filterFishType('other')">其他</button>
                </div>
                
                <!-- 检测框显示区域 -->
                <div class="detection-section">
                    <h3 class="detection-title">
                        <i class="fas fa-vector-square"></i> 鱼类检测信息
                    </h3>
                    <div class="detection-boxes" id="detectionBoxes">
                        <div class="empty-detection">
                            暂无检测数据，启动监控后显示
                        </div>
                    </div>
                </div>
                
                <!-- 日志区域 -->
                <div class="log-section">
                    <h3 class="log-title">
                        <i class="fas fa-clipboard-list"></i> 系统日志
                    </h3>
                    <ul class="log-list" id="logList">
                        <li class="log-item">
                            <span>系统初始化完成</span>
                            <span class="log-time">刚刚</span>
                        </li>
                        <li class="log-item">
                            <span>等待启动监控服务</span>
                            <span class="log-time">刚刚</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2025 海王鱼缸监测系统 | 智能鱼类识别与健康监测 v1.1 | 最后更新: <span id="currentTime">--:--:--</span></p>
        </div>
    </div>

    <script>
        // 服务器配置 - 根据实际情况修改
        const SERVER_URL = 'http://10.29.32.7:5000';
        let monitoringInterval = null;
        let lastUpdateTime = Date.now();
        let currentFilter = 'all';
        
        // 鱼类种类和健康状况数据
        const fishTypes = ['clownfish', 'angel', 'tang', 'guppy', 'betta', 'goldfish', 'koi', 'other'];
        const healthStatuses = ['healthy', 'warning', 'danger'];
        
        // 鱼类中文名称映射
        const fishTypeNames = {
            'clownfish': '小丑鱼',
            'angel': '神仙鱼',
            'tang': '倒吊鱼',
            'guppy': '孔雀鱼',
            'betta': '斗鱼',
            'goldfish': '金鱼',
            'koi': '锦鲤',
            'other': '其他鱼类'
        };
        
        // 健康状况中文映射
        const healthStatusNames = {
            'healthy': '健康',
            'warning': '需关注',
            'danger': '异常'
        };
        
        // DOM元素
        const videoFeed = document.getElementById('videoFeed');
        const videoPlaceholder = document.getElementById('videoPlaceholder');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const fpsValue = document.getElementById('fpsValue');
        const detectionCount = document.getElementById('detectionCount');
        const frameId = document.getElementById('frameId');
        const lastUpdate = document.getElementById('lastUpdate');
        const detectionBoxes = document.getElementById('detectionBoxes');
        const logList = document.getElementById('logList');
        const currentTime = document.getElementById('currentTime');
        const healthyCount = document.getElementById('healthyCount');
        const warningCount = document.getElementById('warningCount');
        const dangerCount = document.getElementById('dangerCount');
        const fishFilter = document.getElementById('fishFilter');
        
        // 更新时间显示
        function updateTime() {
            const now = new Date();
            currentTime.textContent = now.toLocaleTimeString('zh-CN');
        }
        
        // 添加日志
        function addLog(message) {
            const now = new Date();
            const timeString = now.toLocaleTimeString('zh-CN', {hour12: false});
            
            const logItem = document.createElement('li');
            logItem.className = 'log-item';
            logItem.innerHTML = `<span>${message}</span><span class="log-time">${timeString}</span>`;
            
            logList.insertBefore(logItem, logList.firstChild);
            
            // 限制日志数量
            if (logList.children.length > 10) {
                logList.removeChild(logList.lastChild);
            }
        }
        
        // 更新最后更新时间
        function updateLastUpdateTime() {
            const now = Date.now();
            const secondsAgo = Math.floor((now - lastUpdateTime) / 1000);
            lastUpdate.textContent = secondsAgo;
        }
        
        // 启动监控
        async function startMonitoring() {
            try {
                addLog('正在启动监控服务...');
                
                const response = await fetch(`${SERVER_URL}/api/start`, {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.status === 'started' || data.status === 'already_running') {
                    // 显示视频流
                    videoFeed.src = `${SERVER_URL}/video_feed?t=${new Date().getTime()}`;
                    videoFeed.style.display = 'block';
                    videoPlaceholder.style.display = 'none';
                    
                    // 启用停止按钮，禁用启动按钮
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    
                    // 开始定时获取数据
                    if (monitoringInterval) clearInterval(monitoringInterval);
                    monitoringInterval = setInterval(fetchMonitoringData, 1000);
                    
                    addLog('监控服务启动成功');
                    addLog('开始鱼类识别与健康监测');
                } else {
                    addLog(`启动失败: ${data.message}`);
                    alert(`启动失败: ${data.message}`);
                }
            } catch (error) {
                addLog('连接服务器失败');
                console.error('启动监控失败:', error);
                alert('无法连接到监控服务器，请检查网络连接和服务器状态');
            }
        }
        
        // 停止监控
        async function stopMonitoring() {
            try {
                addLog('正在停止监控服务...');
                
                const response = await fetch(`${SERVER_URL}/api/stop`, {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.status === 'stopped' || data.status === 'already_stopped') {
                    // 隐藏视频流，显示占位符
                    videoFeed.src = '';
                    videoFeed.style.display = 'none';
                    videoPlaceholder.style.display = 'flex';
                    
                    // 启用启动按钮，禁用停止按钮
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    
                    // 停止定时获取数据
                    if (monitoringInterval) {
                        clearInterval(monitoringInterval);
                        monitoringInterval = null;
                    }
                    
                    // 重置数据显示
                    resetDataDisplay();
                    
                    addLog('监控服务已停止');
                } else {
                    addLog(`停止失败: ${data.message}`);
                    alert(`停止失败: ${data.message}`);
                }
            } catch (error) {
                addLog('停止监控时出错');
                console.error('停止监控失败:', error);
            }
        }
        
        // 获取监控数据
        async function fetchMonitoringData() {
            try {
                // 模拟数据 - 实际使用时请取消注释下面的真实API调用
                // const response = await fetch(`${SERVER_URL}/api/detection`);
                // const data = await response.json();
                
                // 模拟数据（因为原API没有健康状况和鱼类种类信息）
                const mockData = generateMockDetectionData();
                
                // 更新最后更新时间
                lastUpdateTime = Date.now();
                updateLastUpdateTime();
                
                // 更新数据显示
                updateDataDisplay(mockData);
            } catch (error) {
                console.error('获取监控数据失败:', error);
                addLog('获取监控数据失败');
            }
        }
        
        // 生成模拟检测数据
        function generateMockDetectionData() {
            const frameId = Math.floor(Math.random() * 1000) + 1;
            const fps = 15 + Math.random() * 10;
            const detectionCount = Math.floor(Math.random() * 6) + 1;
            
            const boxes = [];
            const healthStats = { healthy: 0, warning: 0, danger: 0 };
            
            for (let i = 0; i < detectionCount; i++) {
                const x = Math.floor(Math.random() * 280);
                const y = Math.floor(Math.random() * 200);
                const width = 30 + Math.floor(Math.random() * 50);
                const height = 20 + Math.floor(Math.random() * 40);
                
                // 随机选择鱼类种类
                const fishType = fishTypes[Math.floor(Math.random() * fishTypes.length)];
                const fishTypeName = fishTypeNames[fishType] || '未知鱼类';
                
                // 随机选择健康状况
                const healthStatus = healthStatuses[Math.floor(Math.random() * healthStatuses.length)];
                const healthStatusName = healthStatusNames[healthStatus] || '未知';
                
                // 更新健康统计
                healthStats[healthStatus]++;
                
                boxes.push({
                    id: i + 1,
                    x: x,
                    y: y,
                    width: width,
                    height: height,
                    center: { x: x + width/2, y: y + height/2 },
                    fish_type: fishType,
                    fish_type_name: fishTypeName,
                    health_status: healthStatus,
                    health_status_name: healthStatusName,
                    confidence: (0.7 + Math.random() * 0.3).toFixed(2) // 置信度
                });
            }
            
            return {
                frame_id: frameId,
                fps: fps,
                detection_count: detectionCount,
                boxes: boxes,
                health_stats: healthStats,
                timestamp: new Date().toISOString()
            };
        }
        
        // 更新数据显示
        function updateDataDisplay(data) {
            // 更新基本信息
            if (data.status === 'stopped') {
                // 如果服务已停止，重置显示
                resetDataDisplay();
                addLog('监控服务已停止');
                return;
            }
            
            fpsValue.textContent = data.fps.toFixed(1);
            detectionCount.textContent = data.detection_count;
            frameId.textContent = data.frame_id;
            
            // 更新健康统计
            if (data.health_stats) {
                healthyCount.textContent = data.health_stats.healthy || 0;
                warningCount.textContent = data.health_stats.warning || 0;
                dangerCount.textContent = data.health_stats.danger || 0;
            }
            
            // 更新检测框显示
            updateDetectionBoxes(data.boxes);
            
            // 添加数据更新日志
            if (data.frame_id % 10 === 0) {
                addLog(`更新检测数据 - 帧 ${data.frame_id}, 检测到 ${data.detection_count} 条鱼`);
            }
        }
        
        // 更新检测框显示
        function updateDetectionBoxes(boxes) {
            detectionBoxes.innerHTML = '';
            
            if (!boxes || boxes.length === 0) {
                detectionBoxes.innerHTML = '<div class="empty-detection">当前未检测到鱼类</div>';
                return;
            }
            
            // 筛选鱼类
            let filteredBoxes = boxes;
            if (currentFilter !== 'all') {
                filteredBoxes = boxes.filter(box => box.fish_type === currentFilter);
            }
            
            if (filteredBoxes.length === 0) {
                detectionBoxes.innerHTML = `<div class="empty-detection">未检测到${fishTypeNames[currentFilter] || currentFilter}</div>`;
                return;
            }
            
            // 显示检测到的鱼类信息
            filteredBoxes.forEach((box) => {
                const healthClass = `health-${box.health_status}`;
                
                const boxElement = document.createElement('div');
                boxElement.className = 'detection-box';
                boxElement.innerHTML = `
                    <div class="box-header">
                        <div class="box-label">目标 ${box.id}</div>
                        <div class="health-status ${healthClass}">${box.health_status_name}</div>
                    </div>
                    <div class="box-details">
                        <div class="detail-row">
                            <span class="detail-label">鱼类种类:</span>
                            <span class="detail-value fish-type">${box.fish_type_name}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">位置:</span>
                            <span class="detail-value">(${box.x}, ${box.y})</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">尺寸:</span>
                            <span class="detail-value">${box.width}×${box.height}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">置信度:</span>
                            <span class="detail-value">${box.confidence}</span>
                        </div>
                    </div>
                `;
                
                detectionBoxes.appendChild(boxElement);
            });
            
            // 如果还有更多检测框未显示
            if (boxes.length > filteredBoxes.length && filteredBoxes.length > 0) {
                const moreElement = document.createElement('div');
                moreElement.className = 'detection-box';
                moreElement.innerHTML = `
                    <div class="box-header">
                        <div class="box-label">过滤信息</div>
                    </div>
                    <div class="box-details">
                        <div class="detail-row">
                            <span class="detail-label">总检测数:</span>
                            <span class="detail-value">${boxes.length} 条</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">当前显示:</span>
                            <span class="detail-value">${filteredBoxes.length} 条</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">过滤类型:</span>
                            <span class="detail-value fish-type">${fishTypeNames[currentFilter] || currentFilter}</span>
                        </div>
                    </div>
                `;
                detectionBoxes.appendChild(moreElement);
            }
        }
        
        // 鱼类种类筛选
        function filterFishType(type) {
            currentFilter = type;
            
            // 更新按钮状态
            const buttons = fishFilter.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                if (btn.textContent.includes(fishTypeNames[type] || type)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // 重新获取数据并更新显示
            if (monitoringInterval) {
                // 如果是模拟数据，直接重新生成
                const mockData = generateMockDetectionData();
                updateDataDisplay(mockData);
                addLog(`切换显示: ${fishTypeNames[type] || type}`);
            }
        }
        
        // 重置数据显示
        function resetDataDisplay() {
            fpsValue.textContent = '0.0';
            detectionCount.textContent = '0';
            frameId.textContent = '0';
            lastUpdate.textContent = '0';
            healthyCount.textContent = '0';
            warningCount.textContent = '0';
            dangerCount.textContent = '0';
            
            detectionBoxes.innerHTML = '<div class="empty-detection">暂无检测数据，启动监控后显示</div>';
            
            // 重置筛选器
            currentFilter = 'all';
            const buttons = fishFilter.querySelectorAll('.filter-btn');
            buttons.forEach((btn, index) => {
                if (index === 0) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 更新时间
            updateTime();
            setInterval(updateTime, 1000);
            
            // 更新最后更新时间显示
            setInterval(updateLastUpdateTime, 1000);
            
            // 检查服务器状态
            checkServerStatus();
        });
        
        // 检查服务器状态
        async function checkServerStatus() {
            try {
                const response = await fetch(`${SERVER_URL}/api/status`);
                const data = await response.json();
                
                if (data.status === 'running') {
                    // 如果服务已经在运行，自动连接
                    addLog('检测到监控服务正在运行，正在连接...');
                    startMonitoring();
                } else {
                    addLog('监控服务未运行，等待启动');
                }
            } catch (error) {
                console.error('检查服务器状态失败:', error);
                addLog('无法连接到监控服务器，使用模拟数据演示');
                
                // 如果无法连接服务器，使用模拟数据演示
                startBtn.addEventListener('click', function() {
                    if (!monitoringInterval) {
                        // 显示视频占位符
                        videoFeed.style.display = 'none';
                        videoPlaceholder.style.display = 'flex';
                        videoPlaceholder.innerHTML = `
                            <i class="fas fa-video-slash"></i>
                            <p>模拟演示模式 - 实际使用需连接服务器</p>
                            <p style="font-size: 0.9rem; margin-top: 10px;">正在显示模拟检测数据...</p>
                        `;
                        
                        // 启用停止按钮，禁用启动按钮
                        startBtn.disabled = true;
                        stopBtn.disabled = false;
                        
                        // 开始定时获取模拟数据
                        monitoringInterval = setInterval(() => {
                            const mockData = generateMockDetectionData();
                            updateDataDisplay(mockData);
                        }, 1500);
                        
                        addLog('进入模拟演示模式');
                        addLog('开始模拟鱼类识别与健康监测');
                    }
                });
            }
        }
    </script>
</body>
</html>
